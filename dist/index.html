<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5ede0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1914" media="(prefers-color-scheme: dark)">

<title>NBA Career Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Sofia+Sans:wght@500;700;800&family=Sofia+Sans+Condensed:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #f5ede0; --bg2: #efe3d0; --panel: #fffaf2; --panel2: #f3e8d6; --line: #e4d4ba; --text: #3a2e25; --muted: #8b7762;
  --accent: #c9683a; --accent2: #e6a350; --good: #5c8a58; --bad: #b4503f; --gold: #a97a1f; --shadow: 0 1px 0 rgba(120,80,30,.05), 0 14px 30px -18px rgba(110,70,25,.35);
  --r0: #A4A9B3; --r1: #DC0C00; --r2: #ED7E07; --r3: #D9AF00; --r4: #00C424; --r5: #00ADC4; --r6: #374DF5; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1914; --bg2: #241e18; --panel: #28211b; --panel2: #332a22; --line: #45392d; --text: #f2e7d4; --muted: #ab9a82;
    --accent: #e08c58; --accent2: #f0b96a; --good: #8cc088; --bad: #e27d6a; --gold: #e8b84f; --shadow: 0 1px 0 rgba(0,0,0,.25), 0 14px 30px -18px rgba(0,0,0,.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] { --bg: #1e1914; --bg2: #241e18; --panel: #28211b; --panel2: #332a22; --line: #45392d; --text: #f2e7d4; --muted: #ab9a82; --accent: #e08c58; --accent2: #f0b96a; --good: #8cc088; --bad: #e27d6a; --gold: #e8b84f; --shadow: 0 1px 0 rgba(0,0,0,.25), 0 14px 30px -18px rgba(0,0,0,.7); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15.5px/1.55 "Nunito", ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: radial-gradient(1100px 520px at 12% -8%, color-mix(in srgb, var(--accent2) 16%, transparent), transparent 70%), radial-gradient(900px 480px at 100% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%), var(--bg); background-attachment: fixed; min-height: 100vh; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.brand { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: 18px; letter-spacing: .1px; }
#who { flex: 1; color: var(--muted); font-size: 13px; min-width: 120px; }
main { max-width: 860px; margin: 0 auto; padding: 18px 0 60px; }
h1, h2 { font-family: "Fraunces", Georgia, serif; letter-spacing: -.01em; }
h1 { font-size: 28px; margin: 6px 0 8px; font-weight: 700; } h2 { font-size: 20px; margin: 0 0 10px; font-weight: 700; }
h3 { font-size: 12.5px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; font-weight: 800; }
p { margin: 6px 0; } .muted { color: var(--muted); } .small { font-size: 13px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 800; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px; margin: 14px 0; box-shadow: var(--shadow); }
.card.hero { background: linear-gradient(160deg, color-mix(in srgb, var(--accent2) 14%, var(--panel)), var(--panel)); }
.grid { display: grid; gap: 12px; } .g2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } .g3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 9px 18px; transition: transform .12s ease, border-color .15s, box-shadow .15s; }
button:hover { border-color: var(--accent); transform: translateY(-1px); }
button:active { transform: translateY(0) scale(.98); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff9f0; box-shadow: 0 6px 16px -8px var(--accent); }
button.primary:hover { filter: brightness(1.06); }
button.big-btn { padding: 13px 26px; font-size: 16.5px; }
button.danger { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); color: var(--bad); background: transparent; }
button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
input[type=text], select { font: inherit; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; width: 100%; }
input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 1px; }
.pill { display: inline-block; padding: 2px 11px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; font-weight: 700; margin: 3px 5px 2px 0; }
.pill.gold { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); color: var(--gold); } .pill.good { border-color: var(--good); color: var(--good); } .pill.bad { border-color: var(--bad); color: var(--bad); }
.opt { border: 1px solid var(--line); background: var(--panel2); border-radius: 18px; padding: 14px; cursor: pointer; text-align: left; transition: transform .12s, border-color .15s; }
.opt.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 8%, var(--panel2)); }
.opt:hover { border-color: var(--accent); transform: translateY(-1px); }
.opt b { display: block; } .opt .comps { color: var(--muted); font-size: 12px; margin-top: 4px; }
.stars { font-size: 38px; letter-spacing: 4px; color: var(--gold); min-height: 48px; }
.stars .off { color: var(--line); }
.bar { height: 9px; background: var(--panel2); border-radius: 6px; overflow: hidden; } .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 6px; transition: width .35s ease; }
.attr { display: grid; grid-template-columns: 130px 1fr 44px; gap: 10px; align-items: center; margin: 6px 0; font-size: 13.5px; }
.attr.train { grid-template-columns: 130px 1fr 40px 110px; }
.ctl { display: flex; gap: 4px; align-items: center; justify-content: flex-end; } .ctl button { padding: 2px 11px; }
.big { font-family: "Fraunces", Georgia, serif; font-size: 34px; font-weight: 800; line-height: 1; }
.statbox { text-align: center; padding: 12px 8px; background: var(--panel2); border-radius: 16px; border: 1px solid var(--line); }
.statbox .lbl { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; margin-top: 5px; font-weight: 700; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; } th { color: var(--muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; } td:first-child, th:first-child, td.l, th.l { text-align: left; }
.scroll { overflow-x: auto; }
.tick { font-size: 14px; padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.tick.me { background: color-mix(in srgb, var(--accent) 18%, transparent); font-weight: 800; border-radius: 12px; }
.tick .n { width: 34px; color: var(--muted); }
.callout { border-left: 4px solid var(--accent2); padding: 10px 14px; background: var(--panel2); border-radius: 0 14px 14px 0; margin: 10px 0; }
.modal { position: fixed; inset: 0; background: rgba(40,25,10,.55); display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow: auto; z-index: 20; }
.modal.hidden { display: none; } .modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px; max-width: 980px; width: 100%; box-shadow: var(--shadow); }
.reveal { animation: pop .5s ease both; } @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.pos { color: var(--good); } .neg { color: var(--bad); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; } .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff9f0; }
.stats { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.stats .big { font-size: 26px; }
.recbox { text-align: right; }

/* match-by-match */
.feed { margin-top: 6px; }
.match { display: grid; grid-template-columns: 38px 1fr auto; gap: 14px; align-items: center; padding: 13px 16px; margin: 9px 0; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
.match.fresh { animation: slidein .45s cubic-bezier(.2,.8,.25,1) both; }
@keyframes slidein { from { opacity: 0; transform: translateY(-14px) scale(.98); } to { opacity: 1; transform: none; } }
.match.dnp { opacity: .6; box-shadow: none; background: transparent; }
.match.po { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 8%, var(--panel)), var(--panel)); }
.m-res { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-family: "Fraunces", Georgia, serif; }
.m-res.w { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); } .m-res.l { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.m-top { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: baseline; font-size: 13.5px; }
.m-date { color: var(--muted); font-size: 12px; font-weight: 700; } .m-vs { font-weight: 700; } .m-score { margin-left: auto; font-variant-numeric: tabular-nums; }
.m-box { font-size: 14.5px; margin-top: 3px; } .m-box b { font-size: 17px; } .m-shoot { font-size: 12.5px; }
.rating { min-width: 48px; text-align: center; border-radius: 6px; padding: 8px 8px; font: 800 20px/1 "Sofia Sans Condensed", "Sofia Sans", "Inter", "Roboto", "SF Pro Display", -apple-system, "Segoe UI", sans-serif; color: #fff; font-variant-numeric: tabular-nums; letter-spacing: .2px; }
.rating.sm { display: inline-block; min-width: 0; padding: 5px 10px; font-size: 24px; }
.match { font-family: "Sofia Sans", "Nunito", ui-rounded, -apple-system, sans-serif; }
.m-box { font-weight: 500; } .m-box b, .m-score { font-weight: 800; }
.rating.none { background: var(--r0); }
.rating.r1 { background: var(--r1); } .rating.r2 { background: var(--r2); } .rating.r3 { background: var(--r3); } .rating.r4 { background: var(--r4); } .rating.r5 { background: var(--r5); } .rating.r6 { background: var(--r6); }
.divider { text-align: center; margin: 18px 0 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .14em; font-weight: 800; display: flex; align-items: center; gap: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.divider.fresh { animation: slidein .45s both; }
.dot { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; margin-left: 3px; }
.dot.w { background: color-mix(in srgb, var(--good) 25%, transparent); color: var(--good); } .dot.l { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
.ctl-card { position: sticky; top: 56px; z-index: 4; backdrop-filter: blur(8px); background: var(--panel); }
@media (max-width: 560px) {
  .attr { grid-template-columns: 96px 1fr 34px; } .attr.train { grid-template-columns: 96px 1fr 34px 96px; } h1 { font-size: 23px; } .big { font-size: 28px; }
  .match { grid-template-columns: 32px 1fr auto; gap: 10px; padding: 11px 12px; } .m-res { width: 32px; height: 32px; } .rating { min-width: 44px; font-size: 18px; }
  .card { padding: 15px 15px; border-radius: 20px; }
}
@media (prefers-reduced-motion: reduce) { .match.fresh, .reveal, .divider.fresh { animation: none; } button { transition: none; } }
body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { margin-left: -16px; margin-right: -16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); top: env(safe-area-inset-top, 0px); }
main { padding-left: 0; padding-right: 0; }

/* ---------------- phone layout: app-like, thumb-first ---------------- */

  body { padding-left: 12px; padding-right: 12px; -webkit-text-size-adjust: 100%; }

  main { padding: 10px 0 36px; }
  h1 { font-size: 22px; } h2 { font-size: 18px; }
  .card { padding: 14px; margin: 10px 0; border-radius: 20px; }
  button { min-height: 44px; }
  button.primary, .row > button.primary:only-of-type { min-height: 48px; }
  .grid.g2, .grid.g3 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; } .stats .big { font-size: 22px; } .statbox { padding: 10px 4px; border-radius: 14px; } .statbox .lbl { font-size: 10.5px; letter-spacing: .05em; }
  .stars { font-size: 32px; letter-spacing: 2px; }
  .attr { grid-template-columns: 92px 1fr 30px; gap: 8px; font-size: 13px; } .attr.train { grid-template-columns: 92px 1fr 40px 100px; }
  .ctl button { min-width: 40px; min-height: 40px; font-size: 18px; padding: 0; }
  .tabs button { flex: 1; }
  input[type=text], select { font-size: 16px; min-height: 46px; }
  .modal { padding: 0; } .modal .box { border-radius: 0; min-height: 100vh; padding: 14px; } .modal .row button { min-height: 40px; }
  table { font-size: 12px; } th, td { padding: 6px 6px; }

  .scroll { margin: 0 -14px; padding: 0 14px; }

  .row > button.primary:only-child, .card > .row > select, .callout.row > button { flex: 1 1 100%; }

  .sp { padding-bottom: 200px; }

  .ctl-card { position: fixed; left: 0; right: 0; bottom: 0; top: auto; margin: 0; border-radius: 22px 22px 0 0; border-bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 8; box-shadow: 0 -10px 30px -12px rgba(60,35,10,.35); }
  .ctl-card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .ctl-card button.big-btn { grid-column: 1 / -1; font-size: 18px; min-height: 54px; }
  .ctl-card button { font-size: 14px; padding: 8px 6px; white-space: nowrap; }
  .sp > .card:not(.hero):not(.ctl-card) { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; border-radius: 22px 22px 0 0; z-index: 8; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .match { grid-template-columns: 30px 1fr auto; gap: 9px; padding: 10px 11px; margin: 7px 0; border-radius: 16px; }
  .m-res { width: 30px; height: 30px; font-size: 14px; }
  .m-top { font-size: 13px; gap: 0 8px; flex-wrap: wrap; } .m-top .m-date { flex-basis: 100%; } .m-top .m-vs { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .m-box { font-size: 13.5px; } .m-box b { font-size: 16px; } .m-shoot { font-size: 12px; }
  .rating { min-width: 42px; padding: 7px 4px; font-size: 18px; }

  .decision-row { display: block; }
}
@media (max-width: 380px) { .stats { grid-template-columns: repeat(2, 1fr); } .hero .stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .card > .row > .spacer { display: none; } .card > .row > .spacer ~ button { flex: 1 1 100%; } }

</style>
